# Sample/testnet config file for pydexbot.
# This is intended for development and example purposes, not as a production runtime config.
# Actual runtime config is loaded from .config.yaml when present.
# Use a clearer filename such as config.testnet.yaml or config.example.yaml to avoid confusion.
# Use .config.yaml for the active deployment configuration and keep secrets out of source control.
#
# node_url: "https://t.flonscan.io"  # testnet
# node_url: "https://m.flonscan.io"  # mainnet
#
# Current file is a shared repo example rather than the live runtime config.
#
# swap_bot_py main service configuration
node_url: "https://t.flonscan.io"
trade_privkey: "5J4QAKhje6en1DsmvjEW3rbBhNTMsBHH5UaEh4ubuw7ev7unRAL"
bot_admin: "flonian"
fee_payer: "flonian"
tokenx_mm_contract: "tokenx.mm"
buylowsellhi_contract: "buylowsellhi"
bot_mm_contract: "bot.mm"
trade_pairs:
  - "flon.usdt"
  - "sing.usdt"
min_interval_seconds: 4       # Local polling interval after a successful trade; keep below on-chain min_trade_seconds
max_interval_seconds: 12      # Local polling interval after a successful trade; contract schedules still control real readiness
interval_jitter_ratio: 0.35   # Adds +/- jitter to avoid fixed-frequency calls, including min=max configs
retry_min_interval_seconds: 10 # Minimum retry interval after errors, paused markets, or missing bots
retry_max_interval_seconds: 30 # Maximum retry interval after errors, paused markets, or missing bots
ready_jitter_seconds: 8       # Extra random delay after contract schedules table says the pair is ready
target_side_deadband_ratio: 0.006 # Do not force buy/sell when price is within +/-0.6% of target_price
side_segment_seconds: 900     # Neutral-zone side bias window; shorter windows avoid long mechanical ramps
candle_plan_enabled: true     # In neutral zone, shape each 5m candle with body/probe/body side sequencing
candle_seconds: 300           # Candle planning interval; 300 seconds targets 5m K-line wicks
